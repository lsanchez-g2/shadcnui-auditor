<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acme Design System (sample) Audit</title>
<meta name="audit-flavor" content="base">
<meta name="audit-docs" content="https://ui.shadcn.com/docs/theming https://ui.shadcn.com/docs/components/base/button https://ui.shadcn.com/r/styles/base-nova/button.json">
<meta name="audit-verdict" content="NEEDS FIXES">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ---------- tokens ---------- */
:root{
  --bg:#fafafa;--fg:#0a0a0a;--card:#fff;--muted:#f4f4f5;--muted-fg:#71717a;--border:#e4e4e7;--border-strong:#d4d4d8;
  --accent:#18181b;--accent-fg:#fff;
  --crit:#dc2626;--high:#ea580c;--med:#ca8a04;--low:#2563eb;--ok:#16a34a;--info:#6366f1;
  --crit-bg:#fef2f2;--high-bg:#fff7ed;--med-bg:#fefce8;--low-bg:#eff6ff;--ok-bg:#f0fdf4;
  --shadow-sm:0 1px 2px rgba(0,0,0,.05);--shadow:0 1px 3px rgba(0,0,0,.06),0 8px 24px -12px rgba(0,0,0,.12);--shadow-lift:0 2px 6px rgba(0,0,0,.06),0 16px 40px -16px rgba(0,0,0,.18);
  --r:12px;--r-sm:8px;--r-lg:18px;
  --spring:cubic-bezier(.34,1.56,.64,1);--ease:cubic-bezier(.22,1,.36,1);--dur:.42s;
  --sans:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#09090b;--fg:#fafafa;--card:#111113;--muted:#1c1c1f;--muted-fg:#a1a1aa;--border:rgba(255,255,255,.09);--border-strong:rgba(255,255,255,.16);
  --accent:#fafafa;--accent-fg:#09090b;
  --crit:#f87171;--high:#fb923c;--med:#facc15;--low:#60a5fa;--ok:#4ade80;--info:#a5b4fc;
  --crit-bg:rgba(248,113,113,.10);--high-bg:rgba(251,146,60,.10);--med-bg:rgba(250,204,21,.10);--low-bg:rgba(96,165,250,.10);--ok-bg:rgba(74,222,128,.10);
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);--shadow:0 1px 3px rgba(0,0,0,.5),0 8px 24px -12px rgba(0,0,0,.7);--shadow-lift:0 2px 6px rgba(0,0,0,.5),0 16px 40px -16px rgba(0,0,0,.8);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#09090b;--fg:#fafafa;--card:#111113;--muted:#1c1c1f;--muted-fg:#a1a1aa;--border:rgba(255,255,255,.09);--border-strong:rgba(255,255,255,.16);
  --accent:#fafafa;--accent-fg:#09090b;
  --crit:#f87171;--high:#fb923c;--med:#facc15;--low:#60a5fa;--ok:#4ade80;--info:#a5b4fc;
  --crit-bg:rgba(248,113,113,.10);--high-bg:rgba(251,146,60,.10);--med-bg:rgba(250,204,21,.10);--low-bg:rgba(96,165,250,.10);--ok-bg:rgba(74,222,128,.10);
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);--shadow:0 1px 3px rgba(0,0,0,.5),0 8px 24px -12px rgba(0,0,0,.7);--shadow-lift:0 2px 6px rgba(0,0,0,.5),0 16px 40px -16px rgba(0,0,0,.8);
  color-scheme:dark;
}
@media (prefers-reduced-motion:reduce){:root{--dur:0s}*{animation:none!important;transition:none!important}}

/* ---------- base ---------- */
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:24px}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.55 var(--sans);-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01","tnum"}
a{color:inherit}code,.mono{font-family:var(--mono);font-size:12.25px}
code{background:var(--muted);padding:1px 6px;border-radius:5px;border:1px solid var(--border)}
h1{font-size:26px;letter-spacing:-.02em;margin:0;font-weight:600}
h2{font-size:18px;letter-spacing:-.015em;font-weight:600;margin:0 0 4px}
h3{font-size:13px;font-weight:600;color:var(--muted-fg);text-transform:uppercase;letter-spacing:.06em;margin:28px 0 10px}
.sub{color:var(--muted-fg);font-size:13px;margin:0 0 16px}
.num{font-variant-numeric:tabular-nums}

/* ---------- layout ---------- */
.shell{display:grid;grid-template-columns:220px minmax(0,1fr);gap:40px;max-width:1320px;margin:0 auto;padding:36px 32px 120px}
.rail{position:sticky;top:36px;align-self:start;max-height:calc(100vh - 72px);overflow:auto;display:flex;flex-direction:column;z-index:2}
.rail-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:18px}
.brand{font-size:12px;color:var(--muted-fg);text-transform:uppercase;letter-spacing:.08em}
nav.rail-nav{position:relative;display:flex;flex-direction:column;gap:2px}
nav.rail-nav a{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-radius:8px;text-decoration:none;color:var(--muted-fg);font-size:13px;transition:color .2s}
nav.rail-nav a:hover{color:var(--fg)}
nav.rail-nav a.active{color:var(--fg);font-weight:500}
nav.rail-nav a .cnt{font-size:11px;color:var(--muted-fg);font-variant-numeric:tabular-nums}
nav.rail-nav .glide{position:absolute;left:0;right:0;height:34px;background:var(--muted);border-radius:8px;z-index:0;transition:transform .45s var(--spring),opacity .2s;opacity:0}
.theme-btn{appearance:none;border:1px solid var(--border);background:var(--card);color:var(--fg);border-radius:999px;padding:4px 10px;font:inherit;font-size:12px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;transition:transform .25s var(--spring),box-shadow .25s}
.theme-btn:hover{box-shadow:var(--shadow)}.theme-btn:active{transform:scale(.96)}

main{min-width:0}
section.blk{margin-top:56px;scroll-margin-top:24px}
section.blk:first-of-type{margin-top:0}
.reveal{transition:transform .6s var(--ease)}
.reveal.in{transform:none}

/* ---------- hero ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:32px;align-items:start;padding:28px;border:1px solid var(--border);border-radius:var(--r-lg);background:var(--card);box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:-40% -20% auto auto;width:60%;height:120%;background:radial-gradient(closest-side,color-mix(in srgb,var(--score-color,#888) 14%,transparent),transparent);pointer-events:none;filter:blur(12px)}
@media (max-width:760px){.hero{grid-template-columns:1fr}}
.eyebrow{font-size:12px;color:var(--muted-fg);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;display:flex;gap:8px;align-items:center}
.hero .meta{margin-top:12px;display:grid;gap:4px;font-size:13px;color:var(--muted-fg)}
.hero .meta a{color:var(--muted-fg);text-decoration:none;border-bottom:1px solid transparent;transition:border-color .2s,color .2s}
.hero .meta a:hover{color:var(--fg);border-color:var(--border-strong)}
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-weight:600;font-size:12px;border:1px solid transparent;animation:pop .6s var(--spring) both;animation-delay:.25s}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 0 3px color-mix(in srgb,currentColor 25%,transparent)}
.badge.ready{background:var(--ok-bg);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 30%,transparent)}
.badge.fixes{background:var(--high-bg);color:var(--high);border-color:color-mix(in srgb,var(--high) 30%,transparent)}
.badge.blocked{background:var(--crit-bg);color:var(--crit);border-color:color-mix(in srgb,var(--crit) 30%,transparent)}
.badge.health{background:var(--muted);color:var(--fg);border-color:var(--border)}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
.score{display:flex;align-items:center;gap:22px}
.ring{position:relative;width:132px;height:132px}
.ring svg{transform:rotate(-90deg);width:100%;height:100%}
.ring circle{fill:none;stroke-width:9;stroke-linecap:round}
.ring .track{stroke:var(--muted)}
.ring .bar{stroke:var(--score-color);stroke-dasharray:var(--c);stroke-dashoffset:var(--c);transition:stroke-dashoffset 1.4s var(--ease) .2s}
.ring .val{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .val b{font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1}
.ring .val span{font-size:11px;color:var(--muted-fg);margin-top:4px}
.score .lbl{font-size:12px;color:var(--muted-fg);max-width:180px}

/* ---------- kpis ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0;margin-top:20px;border:1px solid var(--border);border-radius:var(--r);background:var(--card);overflow:hidden}
.kpi{padding:14px 18px;border-right:1px solid var(--border);position:relative;overflow:hidden;transition:background .25s}
.kpi:last-child{border-right:0}
.kpi:hover{background:var(--muted)}
.kpi .n{font-size:28px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.kpi .l{font-size:12px;color:var(--muted-fg);margin-top:4px}
.kpi.crit .n{color:var(--crit)}.kpi.high .n{color:var(--high)}.kpi.med .n{color:var(--med)}.kpi.low .n{color:var(--low)}
.kpi .spark{display:none}

/* severity stacked bar */
.sevbar{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--muted);margin-top:18px}
.sevbar i{display:block;height:100%;width:0;transition:width 1.1s var(--ease)}
.sevbar i.critical{background:var(--crit)}.sevbar i.high{background:var(--high)}.sevbar i.medium{background:var(--med)}.sevbar i.low{background:var(--low)}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:8px;font-size:12px;color:var(--muted-fg)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:1px}

/* ---------- dimensions ---------- */
.dims{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:0 28px;margin-top:8px;border-top:1px solid var(--border)}
.dim{padding:12px 0 4px}
.dim .t{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--muted-fg)}
.dim .t b{color:var(--fg);font-size:18px;font-weight:600;letter-spacing:-.02em}
.dim .bar{height:6px;border-radius:999px;background:var(--muted);margin-top:10px;overflow:hidden}
.dim .bar i{display:block;height:100%;width:0;border-radius:999px;background:var(--bar-color,var(--ok));transition:width 1.1s var(--spring)}
.dim .w{font-size:11px;color:var(--muted-fg);margin-top:6px}

/* ---------- cards / panels ---------- */
.panel{border:1px solid var(--border);border-radius:var(--r);background:var(--card);box-shadow:var(--shadow-sm);padding:16px 18px}
.panel.warn{border-color:color-mix(in srgb,var(--high) 45%,transparent);background:var(--high-bg)}
.lead{font-size:15px;line-height:1.65;max-width:78ch;margin:0}
ol.top{margin:12px 0 0;padding-left:0;list-style:none;counter-reset:t;display:grid;gap:8px}
ol.top li{counter-increment:t;position:relative;padding:8px 0 8px 40px;border-bottom:1px solid var(--border);font-size:13.5px}
ol.top li:last-child{border-bottom:0}
ol.top li::before{content:counter(t);position:absolute;left:6px;top:9px;width:22px;height:22px;border-radius:7px;background:var(--accent);color:var(--accent-fg);font-size:11.5px;font-weight:600;display:grid;place-items:center}

/* ---------- fix order timeline ---------- */
.steps{position:relative;padding-left:0;margin:0;list-style:none;display:grid;gap:10px}
.step{display:grid;grid-template-columns:36px 1fr;gap:14px;align-items:start}
.step .dot{width:36px;height:36px;border-radius:50%;background:var(--card);border:1px solid var(--border);display:grid;place-items:center;font-weight:600;font-size:13px;box-shadow:var(--shadow-sm);position:relative}
.step:not(:last-child) .dot::after{content:"";position:absolute;top:36px;left:50%;width:1px;height:calc(100% + 10px);background:var(--border);transform:translateX(-50%)}
.step .body{padding:6px 0 14px;border-bottom:1px solid var(--border)}
.step:last-child .body{border-bottom:0}
.step .act{font-weight:500;display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.step .rc{color:var(--muted-fg);font-size:12.5px;margin-top:4px}
.step .ids{margin-top:8px;display:flex;flex-wrap:wrap;gap:4px}
.pill{display:inline-flex;align-items:center;font-size:11px;color:var(--muted-fg);border:1px solid var(--border);border-radius:999px;padding:1px 8px;white-space:nowrap;background:var(--card)}
.pill.eff{font-weight:600;color:var(--fg)}

/* ---------- filters ---------- */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:16px 0}
.chips{position:relative;display:inline-flex;gap:4px;padding:4px;border:1px solid var(--border);border-radius:999px;background:var(--card)}
.chip{position:relative;z-index:1;appearance:none;border:0;background:transparent;color:var(--muted-fg);font:inherit;font-size:12.5px;padding:5px 11px;border-radius:999px;cursor:pointer;transition:color .2s,transform .25s var(--spring)}
.chip:active{transform:scale(.94)}
.chip.on{color:var(--fg);font-weight:500}
.chip .c{font-size:11px;opacity:.7;margin-left:5px}
.chips .glide{position:absolute;top:4px;left:0;height:calc(100% - 8px);background:var(--muted);border-radius:999px;z-index:0;transition:transform .45s var(--spring),width .45s var(--spring),opacity .2s}
.search{margin-left:auto;padding:7px 12px 7px 32px;border:1px solid var(--border);border-radius:999px;background:var(--card) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%2371717a' stroke-width='2'><circle cx='11' cy='11' r='7'/><path d='m20 20-3.5-3.5'/></svg>") 11px 50% no-repeat;color:var(--fg);font:inherit;font-size:13px;min-width:220px;transition:box-shadow .2s,border-color .2s}
.search:focus{outline:none;border-color:var(--border-strong);box-shadow:0 0 0 3px color-mix(in srgb,var(--fg) 8%,transparent)}
.sev{display:inline-flex;align-items:center;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;text-transform:uppercase;letter-spacing:.05em;color:#fff}
.sev.critical{background:var(--crit)}.sev.high{background:var(--high)}.sev.medium{background:var(--med);color:#1c1917}.sev.low{background:var(--low)}
:root[data-theme="dark"] .sev{color:#09090b}

/* ---------- findings ---------- */
.flist{display:grid;gap:0;border:1px solid var(--border);border-radius:var(--r);background:var(--card);overflow:hidden}
.f{border-bottom:1px solid var(--border);background:var(--card);position:relative;transition:background .25s}
.f:last-child{border-bottom:0}
.f:hover{background:color-mix(in srgb,var(--muted) 55%,var(--card))}
.f.open{background:color-mix(in srgb,var(--muted) 35%,var(--card))}
.f.hide{display:none}
.fh{appearance:none;border:0;background:transparent;color:inherit;font:inherit;text-align:left;width:100%;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto auto auto;gap:12px;align-items:center;padding:12px 16px 12px 18px}
.fh .el{font-weight:500;line-height:1.35}
.fh .lp{color:var(--muted-fg);font-size:12px;margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.fh .sc{font-size:12px;color:var(--muted-fg);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.fh .sc b{color:var(--fg);font-weight:600}
.fh .sc .arrow{width:14px;height:1px;background:var(--border-strong);position:relative}
.fh .sc .arrow::after{content:"";position:absolute;right:-1px;top:-3px;width:6px;height:6px;border-top:1px solid var(--border-strong);border-right:1px solid var(--border-strong);transform:rotate(45deg)}
.fh .chev{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;color:var(--muted-fg);transition:transform .45s var(--spring),background .2s}
.f.open .fh .chev{transform:rotate(180deg);background:var(--muted)}
.fb{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s var(--ease)}
.f.open .fb{grid-template-rows:1fr}
.fb>div{overflow:hidden;min-height:0}
.fb .inner{padding:4px 18px 16px 18px;border-top:1px solid var(--border);display:grid;grid-template-columns:1fr 1fr;gap:12px 24px}
@media (max-width:700px){.fb .inner{grid-template-columns:1fr}.fh{grid-template-columns:auto 1fr auto}}
.fb .inner>div{padding-top:12px;opacity:0;transform:translateY(6px);transition:opacity .35s var(--ease),transform .35s var(--ease)}
.f.open .fb .inner>div{opacity:1;transform:none}
.f.open .fb .inner>div:nth-child(1){transition-delay:.08s}.f.open .fb .inner>div:nth-child(2){transition-delay:.12s}.f.open .fb .inner>div:nth-child(3){transition-delay:.16s}.f.open .fb .inner>div:nth-child(4){transition-delay:.2s}.f.open .fb .inner>div:nth-child(5){transition-delay:.24s}.f.open .fb .inner>div:nth-child(n+6){transition-delay:.28s}
.fb .full{grid-column:1/-1}
.fb b.k{display:block;font-size:10.5px;color:var(--muted-fg);font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.fb .vals{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.fb .vals code{display:block;white-space:pre-wrap;word-break:break-word}
.fb .vals .to{color:var(--muted-fg)}
.fb ul{margin:0;padding-left:16px}.fb li{margin:2px 0}
.copy{appearance:none;border:1px solid var(--border);background:var(--card);color:var(--muted-fg);border-radius:6px;font:inherit;font-size:11px;padding:2px 8px;cursor:pointer;margin-left:8px;transition:transform .25s var(--spring),color .2s}
.copy:hover{color:var(--fg)}.copy:active{transform:scale(.92)}.copy.done{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.tag{display:inline-flex;font-size:10.5px;color:var(--med);border:1px solid color-mix(in srgb,var(--med) 45%,transparent);background:var(--med-bg);border-radius:999px;padding:1px 7px;font-weight:600}

/* ---------- tables ---------- */
.tblwrap{border:1px solid var(--border);border-radius:var(--r);overflow:auto;background:var(--card);box-shadow:var(--shadow-sm);max-height:560px}
table.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
.tbl th{position:sticky;top:0;background:var(--card);text-align:left;font-weight:500;font-size:11.5px;color:var(--muted-fg);text-transform:uppercase;letter-spacing:.05em;padding:10px 12px;border-bottom:1px solid var(--border);cursor:pointer;user-select:none;white-space:nowrap;z-index:1}
.tbl th:hover{color:var(--fg)}
.tbl th.sorted::after{content:" ↑";opacity:.7}.tbl th.sorted.desc::after{content:" ↓"}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:top}
.tbl tbody tr{transition:background .15s}.tbl tbody tr:hover{background:var(--muted)}
.tbl tbody tr:last-child td{border-bottom:0}
.ok{color:var(--ok);font-weight:600}.bad{color:var(--crit);font-weight:600}.na{color:var(--muted-fg)}
.sw{display:inline-flex;align-items:center;gap:7px}
.sw i{width:14px;height:14px;border-radius:4px;border:1px solid var(--border-strong);display:inline-block;flex:none}
.pair{display:inline-grid;place-items:center;width:34px;height:24px;border-radius:6px;border:1px solid var(--border);font-weight:700;font-size:12px}
.ratio{display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums;font-weight:600;padding:2px 8px;border-radius:999px;font-size:12px}
.ratio.pass{background:var(--ok-bg);color:var(--ok)}.ratio.large{background:var(--med-bg);color:var(--med)}.ratio.fail{background:var(--crit-bg);color:var(--crit)}.ratio.exempt{background:var(--muted);color:var(--muted-fg)}
.cell{display:inline-flex;align-items:center;gap:6px;font-size:12px}
.cell i{width:12px;height:12px;border-radius:3px;display:inline-block}
.cell.present i{background:var(--ok)}.cell.missing i{background:var(--crit)}.cell.inconsistent i{background:var(--med)}
.axis{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11.5px;font-weight:600}
.axis.pass{background:var(--ok-bg);color:var(--ok)}.axis.fail{background:var(--crit-bg);color:var(--crit)}.axis.unverified{background:var(--muted);color:var(--muted-fg)}
.status{font-weight:600}.status.ok{color:var(--ok)}.status.bad{color:var(--crit)}

.empty{color:var(--muted-fg);font-style:italic;padding:12px 0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
.card{border:1px solid var(--border);border-radius:var(--r);background:var(--card);padding:14px 16px;box-shadow:var(--shadow-sm);transition:transform .3s var(--spring),box-shadow .3s}
.card:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.card .h{font-weight:600;margin-bottom:4px}
.small{font-size:12px;color:var(--muted-fg)}
ul.plain{margin:0;padding-left:0;list-style:none;display:grid;gap:6px}
ul.plain li{padding:8px 12px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--card);display:flex;justify-content:space-between;gap:10px;align-items:baseline;font-size:13px}
.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,40px);opacity:0;background:var(--accent);color:var(--accent-fg);padding:10px 16px;border-radius:999px;font-size:13px;box-shadow:var(--shadow-lift);transition:transform .5s var(--spring),opacity .3s;pointer-events:none;z-index:9}
.toast.show{transform:translate(-50%,0);opacity:1}
@media (max-width:960px){
  .shell{grid-template-columns:1fr;gap:16px;padding:20px 16px 80px}
  .rail{position:static;max-height:none;overflow:visible;flex-direction:column;gap:10px}
  .rail-head{margin-bottom:0}
  nav.rail-nav{flex-direction:row;flex-wrap:wrap;gap:6px}
  nav.rail-nav .glide{display:none}
  nav.rail-nav a{padding:4px 10px;border:1px solid var(--border);border-radius:999px;font-size:12px;background:var(--card)}
  nav.rail-nav a.active{background:var(--muted)}
  nav.rail-nav a .cnt{margin-left:6px}
  .hero{grid-template-columns:1fr}
}
@media print{.rail,.filters,.theme-btn,.copy{display:none!important}.shell{grid-template-columns:1fr;padding:0}.f .fb{grid-template-rows:1fr!important}.f .fb .inner>div{opacity:1!important;transform:none!important}.reveal{opacity:1!important;transform:none!important}.tblwrap{max-height:none}}

/* ---------- designer-friendly layout ---------- */
.hero.simple{grid-template-columns:minmax(0,1fr) auto;align-items:center}
.verdict-line{margin:14px 0 0;font-size:16px;line-height:1.55;max-width:60ch}
.counts{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:16px;font-size:13px;color:var(--muted-fg);align-items:center}
.counts b{color:var(--fg);font-weight:600}
.counts .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.fixcards{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.fixcard{display:grid;grid-template-columns:40px 1fr;gap:16px;padding:18px 20px;border:1px solid var(--border);border-radius:var(--r);background:var(--card);box-shadow:var(--shadow-sm);border-left:4px solid var(--sevc,var(--border-strong))}
.fixcard.critical{--sevc:var(--crit)}.fixcard.high{--sevc:var(--high)}.fixcard.medium{--sevc:var(--med)}.fixcard.low{--sevc:var(--low)}
.fixcard .n{width:36px;height:36px;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-weight:600}
.fixcard .top{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.fixcard .act{font-weight:600;font-size:15px}
.fixcard dl{margin:10px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.fixcard dt{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted-fg);padding-top:3px}
.fixcard dt.fixl{color:var(--ok)}
.fixcard dd{margin:0}
.fixcard .more{margin-top:10px;font-size:12px;color:var(--muted-fg)}
.fixcard .more a{color:inherit}
.note{margin-top:12px;font-size:12.5px;color:var(--muted-fg)}
details.fold{border:1px solid var(--border);border-radius:var(--r);background:var(--card);margin-bottom:10px;box-shadow:var(--shadow-sm)}
details.fold>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:14px 18px}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary:hover{background:var(--muted);border-radius:var(--r)}
details.fold[open]>summary{border-bottom:1px solid var(--border);border-radius:var(--r) var(--r) 0 0}
details.fold .ttl{font-weight:600}details.fold .one{color:var(--muted-fg);font-size:12.5px;margin-top:1px}
details.fold .chev{color:var(--muted-fg);transition:transform .25s}
details.fold[open]>summary .chev{transform:rotate(180deg)}
details.fold>.fbody{padding:14px 18px 18px}
details.fold>.fbody .flist{border:0;border-radius:0;background:transparent}
@media print{details.fold>*:not(summary){display:block!important}}

.promptbox{position:relative;margin:0;padding:12px 14px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--muted);font:12.5px/1.6 var(--mono);white-space:pre-wrap;word-break:break-word;color:var(--fg)}
.fixcard dt.promptl{color:var(--info,var(--low))}
.fixcard dd .pcopy{margin:8px 0 0 0}
.allprompt{margin-top:18px;padding:18px 20px;border:1px solid var(--border);border-radius:var(--r);background:var(--card);box-shadow:var(--shadow-sm)}
.allprompt .hd{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:6px}
.allprompt h3{margin:0;font-size:15px;font-weight:600;text-transform:none;letter-spacing:0;color:var(--fg)}
.allprompt .small{margin:0 0 12px}
</style>
</head>

    now?[h('dt',{},hasPlain?'Now':'Cause'),h('dd',{},now)]:null,
    hasPlain?[h('dt',{cls:'fixl'},'Fix'),h('dd',{},fix)]:(st.action&&!oneLine(st.plain_title)?null:[h('dt',{cls:'fixl'},'Fix'),h('dd',{},oneLine(st.action))]),
    String(st.plain_prompt||'').trim()?[h('dt',{cls:'promptl'},'Prompt'),h('dd',{},h('pre',{cls:'promptbox'},String(st.plain_prompt).trim()),copyBtn(String(st.plain_prompt).trim(),'copy prompt'))]:null),
   h('div',{cls:'more'},`Covers ${n} finding${n===1?'':'s'} · `,(st.finding_ids||[]).slice(0,6).map(id=>[h('a',{href:'#f-'+id},id),' '])))) }))); }
else fx.append(h('div',{cls:'empty'},'No fix order provided by reviewer.'));
if(D.combined_prompt){const all=D.combined_prompt;
 fx.append(h('div',{cls:'allprompt',id:'prompt-all'},
  h('div',{cls:'hd'},h('h3',{},'Fix everything at once'),copyBtn(all,'Copy all')),
  h('p',{cls:'small'},'One prompt that applies every fix above, in order. Paste it into Claude with Figma connected.'),
  h('pre',{cls:'promptbox'},all)))}
app.append(fx);

/* ---------- health by area ---------- */
const hl=section('health','Health by area');
if(score.by_dimension){const dims=h('div',{cls:'dims',style:'padding:18px 20px;border:1px solid var(--border);border-radius:var(--r);background:var(--card)'},Object.entries(score.by_dimension).filter(([d])=>isSystem?true:d!=='governance').map(([d,v])=>{const pct=v.rate==null?null:Math.round(v.rate*100);
 return h('div',{cls:'dim',style:`--bar-color:${pct==null?'var(--muted-fg)':scoreColor(pct)}`},h('div',{cls:'t'},h('span',{},d.replace('_',' / ')),h('b',{cls:'num'},pct==null?'—':pct+'%')),h('div',{cls:'bar'},h('i',{'data-w':pct||0})))}));
 hl.append(dims);later(()=>dims.querySelectorAll('.bar i').forEach((i,k)=>setTimeout(()=>i.style.width=i.dataset.w+'%',60*k)),180)}
if(ADJ)hl.append(h('p',{cls:'note'},`${(R.accepted_divergences||[]).length} deliberate difference${(R.accepted_divergences||[]).length===1?'':'s'} from shadcn accepted. Score with ${ADJ.checks_excluded} check${ADJ.checks_excluded===1?'':'s'} excluded: `,h('b',{},ADJ.scores.compliance_pct+'%'),`, raw ${ADJ.raw_compliance_pct}%.`));
if(c.off_spec_scope_checks_excluded)hl.append(h('p',{cls:'note'},`${c.off_spec_scope_checks_excluded} checks on off-spec variants were left out of the score; their findings are still listed and tagged.`));
app.append(hl);

/* ---------- technical details (all folded) ---------- */
const dt=section('details','Technical details','For when you need the numbers behind a fix. Closed by default.');
function fold(title,one,count,build,open){const d=h('details',{cls:'fold'});if(open)d.open=true;d.append(h('summary',{},h('div',{},h('div',{cls:'ttl'},title),h('div',{cls:'one'},one)),count!=null?h('span',{cls:'pill'},count):h('span',{}),h('span',{cls:'chev'},'⌄')));const b=h('div',{cls:'fbody'});build(b);d.append(b);dt.append(d);return d}

/* findings */
const filt={sev:new Set(SEV),agent:null,q:''};
const cards=new Map();
const fdet=fold('All findings','Exact layers, values, token names and evidence',M.findings.length,body=>{
 const agents=[...new Set(M.findings.flatMap(f=>f.agents||[f.agent]))].sort();
 const sevChips=h('div',{cls:'chips'},SEV.map(s=>h('button',{cls:'chip on',type:'button','data-s':s},s,h('span',{cls:'c num'},sev[s]||0))));
 sevChips.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{const s=b.dataset.s;filt.sev.has(s)?filt.sev.delete(s):filt.sev.add(s);b.classList.toggle('on');draw()});
 const agChips=h('div',{cls:'chips'},h('button',{cls:'chip on',type:'button','data-a':''},'all agents'),agents.map(a=>h('button',{cls:'chip',type:'button','data-a':a},a)));
 agChips.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{filt.agent=b.dataset.a||null;agChips.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===b));draw()});
 const search=h('input',{cls:'search',placeholder:'Search findings…',type:'search'});search.oninput=e=>{filt.q=e.target.value.toLowerCase();draw()};
 body.append(h('div',{cls:'filters'},sevChips,agChips,search));
 const list=h('div',{cls:'flist'});body.append(list);
 for(const f of M.findings){
  const head=h('button',{cls:'fh',type:'button','aria-expanded':'false'},
   h('span',{cls:'sev '+f.severity},f.severity),
   h('div',{},h('div',{cls:'el'},f.element),h('div',{cls:'lp'},h('span',{},f.layer_path),f.node_id?h('code',{},f.node_id):null,f.off_spec_scope?h('span',{cls:'tag'},'off-spec scope'):null,f.demoted_from?h('span',{cls:'pill'},'was '+f.demoted_from):null)),
   h('span',{cls:'pill eff',title:'effort'},f.effort),
   h('span',{cls:'sc num'},h('span',{},f.current_score??'–'),h('span',{cls:'arrow'}),h('b',{},f.final_score??'–')),
   h('span',{cls:'chev'},'⌄'));
  const fbody=h('div',{cls:'fb'},h('div',{},h('div',{cls:'inner'},
   h('div',{cls:'full'},h('b',{cls:'k'},'Current → expected'),h('div',{cls:'vals'},h('code',{},f.current_value||'—'),h('span',{cls:'to'},'→'),h('code',{},f.expected_value))),
   h('div',{cls:'full'},h('b',{cls:'k'},'Fix',copyBtn(f.fix)),f.fix),
   h('div',{},h('b',{cls:'k'},'Benefit'),f.benefit||'—'),
   h('div',{},h('b',{cls:'k'},'Source'),h('a',{href:f.source,target:'_blank',rel:'noopener',cls:'mono',style:'word-break:break-all'},f.source)),
   h('div',{cls:'full'},h('b',{cls:'k'},'Evidence'),h('ul',{},(f.evidence_all||[f.evidence]).map(e=>h('li',{cls:'mono'},e)))),
   h('div',{cls:'full small'},`${f.category} · ${f.dimension} · ${f.confidence} · ${(f.agents||[f.agent]).join(', ')} · ${(f.merged_ids||[f.id]).join(', ')}`))));
  const card=h('article',{cls:'f '+f.severity,id:'f-'+f.id},head,fbody);
  head.onclick=()=>{const o=card.classList.toggle('open');head.setAttribute('aria-expanded',o)};
  cards.set(f,card);list.append(card);
 }
 function draw(){let n=0;for(const[f,card]of cards){const show=filt.sev.has(f.severity)&&(!filt.agent||(f.agents||[f.agent]).includes(filt.agent))&&(!filt.q||JSON.stringify(f).toLowerCase().includes(filt.q));card.classList.toggle('hide',!show);if(show)n++}
  let e=list.querySelector('.empty');if(!n){if(!e)list.append(h('div',{cls:'empty'},'Nothing matches.'))}else e?.remove()}
});
/* links from a fix card open the findings fold and the finding */
addEventListener('hashchange',()=>{const el=document.querySelector(location.hash);if(el?.classList.contains('f')){fdet.open=true;el.classList.add('open');el.querySelector('.fh').setAttribute('aria-expanded','true');el.scrollIntoView({block:'center'})}});

/* contrast + states */
fold('Contrast & states',(()=>{const m=T.contrast?.matrix||{};let tot=0,bad=0;for(const k of Object.keys(m))for(const r of m[k]){if(r.exempt)continue;tot++;if(!(r.aa||r.aa_large_ui))bad++}return tot?`${bad} of ${tot} color pairs below threshold`:'WCAG ratios and variant × state coverage'})(),null,body=>{
 if(T.contrast?.matrix){for(const mode of Object.keys(T.contrast.matrix)){body.append(h('h3',{},'Contrast · '+mode));
  body.append(table(['pair','sample','surface_hex','foreground_hex','backdrop_hex','ratio','aa','aa_large_ui','aaa','exempt'],T.contrast.matrix[mode],(r,k)=>{
   if(k==='sample')return isHex(r.surface_hex)&&isHex(r.foreground_hex)?pairChip(r.foreground_hex,r.surface_hex):h('span',{cls:'na'},'—');
   if(k==='ratio'){const cls=r.exempt?'exempt':r.aa?'pass':r.aa_large_ui?'large':'fail';return h('span',{cls:'ratio '+cls},String(r.ratio),':1')}
   if(k==='pair')return h('code',{},r[k]);return fmt(r[k])},{aa_large_ui:'AA large / UI',aa:'AA',aaa:'AAA'}))}}
 else body.append(h('div',{cls:'empty'},'No contrast matrix.'));
 if(T.states?.coverage){for(const[set,x]of Object.entries(T.states.coverage)){body.append(h('h3',{},'States · '+set,' ',h('span',{cls:'pill'},'convention: '+(x.convention||'unknown'))));
  const cols=['variant',...(x.states||[])];const rows=(x.variants||[]).map(v=>{const o={variant:v};for(const st of x.states||[])o[st]=x.cells?.[`${v}|${st}`]||'missing';return o});
  body.append(table(cols,rows,(r,k)=>k==='variant'?h('code',{},r[k]):h('span',{cls:'cell '+r[k]},h('i',{}),r[k])))}}
 else body.append(h('div',{cls:'empty'},'No coverage matrices.'))});

/* tokens, parity, architecture */
fold('Tokens, parity & architecture','Token inventory, alias chains, light/dark, shadcn match, handoff readiness',null,body=>{
 if(T.tokens?.inventory?.length){body.append(h('h3',{},'Token inventory'));body.append(table(['token','present','collection','mode_coverage','aliased','notes'],T.tokens.inventory,(r,k)=>k==='token'?h('code',{},r[k]):fmt(r[k])))}
 if(T.components?.parity){const sets=Object.entries(T.components.parity);const axes=['naming','variants','sizes','states','tokens','layout','typography','anatomy','props','a11y'];
  body.append(h('h3',{},'Component parity'));body.append(table(['component',...axes],sets.map(([n,p])=>({component:n,...(p.axes||{})})),(r,k)=>k==='component'?h('strong',{},r[k]):h('span',{cls:'axis '+(r[k]||'unverified')},r[k]||'—')))}
 if(T.governance?.readiness){body.append(h('h3',{},'Handoff readiness'));const rows=Object.entries(T.governance.readiness).map(([n,p])=>({component:n,...p}));body.append(table(['component','published','description','hidden_layers','naming_consistent','code_connect_ready'],rows,(r,k)=>k==='component'?h('strong',{},r[k]):fmt(r[k])))}
 if(T.variables?.chains?.length){body.append(h('h3',{},'Alias chains'));body.append(table(['variable','tier','alias_of','resolves_to','status'],T.variables.chains,(r,k)=>k==='status'?h('span',{cls:'status '+(r[k]==='ok'?'ok':r[k]==='unverified'?'na':'bad')},r[k]):k==='variable'?h('code',{},r[k]):fmt(r[k])))}
 if(T.modes?.parity?.length){body.append(h('h3',{},'Mode parity'));body.append(table(['token','light','dark','identical','deliberate'],T.modes.parity,(r,k)=>k==='token'?h('code',{},r[k]):fmt(r[k])))}
 if(T.styles?.styles?.length){body.append(h('h3',{},'Styles'));body.append(table(['style','kind','maps_to','status'],T.styles.styles,(r,k)=>k==='style'?h('code',{},r[k]):k==='status'?h('span',{cls:'status '+(r[k]==='ok'?'ok':'bad')},r[k]):fmt(r[k])))}
 if(!body.children.length)body.append(h('div',{cls:'empty'},'No tables from these agents.'))});

/* compliant + off-spec + unverified */
fold('Already correct & off-spec','What to leave alone, what shadcn does not define, what could not be checked',`${M.compliant.length} + ${M.off_spec.length}`,body=>{
 body.append(h('h3',{},'Already correct, do not touch'));
 body.append(M.compliant.length?h('ul',{cls:'plain'},M.compliant.map(x=>h('li',{},h('span',{},x.item),h('span',{cls:'pill'},x.agent)))):h('div',{cls:'empty'},'None.'));
 body.append(h('h3',{},'Off-spec inventory'));
 if(M.off_spec.length)body.append(table(['item','reason','recommendation','agent'],M.off_spec));else body.append(h('div',{cls:'empty'},'Nothing outside the shadcn spec.'));
 if(M.unverified?.length){body.append(h('h3',{},`Unverified checks (${M.unverified.length})`));body.append(table(['check','missing','agent'],M.unverified))}
 if(M.needs_verification?.length){body.append(h('h3',{},'Needs verification'));body.append(h('p',{cls:'small'},'Reported critical but not confirmable from the snapshot; listed as high until verified: ',M.needs_verification.map(id=>h('code',{},id))))}
 if(M.conflicts?.length){body.append(h('h3',{},'Specialist disagreements'));body.append(h('div',{cls:'grid2'},M.conflicts.map(k=>{const res=(R.resolutions||[]).find(r=>r.finding_ids?.some(id=>k.finding_ids.includes(id)));return h('div',{cls:'card'},h('div',{cls:'h'},k.element),h('div',{cls:'small'},k.layer_path),h('ul',{style:'margin:8px 0;padding-left:16px'},k.expected_values.map(v=>h('li',{cls:'mono'},v))),res?h('div',{},h('b',{},'Resolution: '),res.decision,' ',h('span',{cls:'small'},'(',res.basis,')')):h('div',{cls:'bad small'},'Unresolved'))})))}});

/* divergences + recommendations + audit trail */
const divergences=R.accepted_divergences||[];
fold('Decisions & recommendations','Accepted differences from shadcn, structural suggestions, reviewer demotions',`${divergences.length} + ${(R.recommendations||[]).length}`,body=>{
 if(divergences.length){body.append(h('h3',{},'Accepted divergences'));body.append(h('p',{cls:'small'},'Real, verified differences from shadcn the reviewer confirmed are deliberate design-system decisions. Excluded from the adjusted score; listed so the reasoning stays auditable.'));
  body.append(h('div',{cls:'grid2'},divergences.map(d=>{
   const fs=(d.finding_ids||[]).map(findingById).filter(Boolean);
   return h('div',{cls:'card'},h('div',{cls:'h'},(d.finding_ids||[]).join(', ')),h('div',{},h('b',{},'Rationale: '),d.rationale),d.evidence?h('div',{cls:'small'},h('b',{},'Evidence: '),d.evidence):null,
    fs.length?h('ul',{style:'margin:8px 0;padding-left:16px'},fs.map(f=>h('li',{cls:'small'},h('span',{},f.element),' — ',h('code',{},f.current_value),' kept (spec expects ',h('code',{},f.expected_value),')'))):null)})))}
 body.append(h('h3',{},'Recommendations'));
 if(R.recommendations?.length)body.append(h('div',{cls:'grid2'},R.recommendations.map(r=>h('div',{cls:'card'},h('div',{cls:'h'},r.title),h('div',{},r.rationale),r.aligns_with?h('div',{cls:'small',style:'margin-top:6px'},'Aligns with ',h('code',{},r.aligns_with)):null))));else body.append(h('div',{cls:'empty'},'None.'));
 if(R.demotions?.length){body.append(h('h3',{},'Reviewer demotions'));body.append(table(['finding_id','from','to','reason'],R.demotions,(r,k)=>k==='finding_id'?h('code',{},r[k]):fmt(r[k])))}
 if(R.gaps?.length){body.append(h('h3',{},'Gaps flagged for re-run'));body.append(table(['owner_agent','what'],R.gaps))}});

fold('How this was audited','Spec sources and agent run log',`${Object.keys(M.agents||{}).length} agents`,body=>{
 body.append(h('p',{cls:'small',style:'margin-top:0'},'Audited ',meta.audited_at||'',' against: ',...(meta.docs_fetched||[]).flatMap(u=>[h('a',{href:u,target:'_blank',rel:'noopener'},u),' ']),meta.root_node_id?[' · node ',h('code',{},meta.root_node_id)]:null,' · flavor ',h('code',{},meta.flavor||'unknown')));
 if(meta.scope_note)body.append(h('p',{cls:'small'},meta.scope_note));
 body.append(table(['agent','file','checks','findings','unverified'],Object.entries(M.agents||{}).map(([a,v])=>({agent:a,...v}))));
 if(M.missing_agents?.length)body.append(h('p',{cls:'bad'},'Missing agents: ',M.missing_agents.join(', ')));
 if(Object.keys(M.notes||{}).length)body.append(h('div',{cls:'grid2',style:'margin-top:12px'},Object.entries(M.notes).map(([a,n])=>h('div',{cls:'card'},h('div',{cls:'h'},a),h('div',{cls:'small'},n)))))});
app.append(dt);

/* ---------- rail nav + glide + reveal ---------- */
const nav=document.getElementById('nav'),glide=document.getElementById('glide');
const secs=[...document.querySelectorAll('section.blk')];
for(const s of secs){const t=s.id==='summary'?'Summary':(s.querySelector('h2')?.firstChild?.textContent||s.id);const cnt=s.querySelector('h2 .pill')?.textContent;nav.append(h('a',{href:'#'+s.id,'data-id':s.id},t,cnt?h('span',{cls:'cnt'},cnt):null))}
function setActive(id){const a=nav.querySelector(`a[data-id="${id}"]`);if(!a)return;nav.querySelectorAll('a').forEach(x=>x.classList.toggle('active',x===a));if(innerWidth<=960){glide.style.opacity=0;return}glide.style.opacity=1;glide.style.transform=`translateY(${a.offsetTop}px)`}
const io=new IntersectionObserver(es=>{for(const e of es){if(e.isIntersecting){e.target.classList.add('in')}}},{threshold:.08});
secs.forEach(s=>io.observe(s));
const io2=new IntersectionObserver(es=>{const vis=es.filter(e=>e.isIntersecting).sort((a,b)=>a.boundingClientRect.top-b.boundingClientRect.top);if(vis[0])setActive(vis[0].target.id)},{rootMargin:'-20% 0px -60% 0px',threshold:0});
secs.forEach(s=>io2.observe(s));
setActive('summary');
</script>
